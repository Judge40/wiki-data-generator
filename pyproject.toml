[project]
name = "wiki-data-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2",
    "requests>=2.31",
    "requests-cache>=1.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.15"
]

[tool.setuptools]
py-modules = ["cli", "config", "fetcher"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
